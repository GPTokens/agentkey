name: Release assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload assets to"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/agentkey-manager/package-lock.json
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y
      - name: Build frontend
        working-directory: apps/agentkey-manager
        run: npm ci && npm run vite:build
      - name: Build binaries
        run: cargo build --release -p agentkey-launcher -p agentkey-manager
      - name: Package setup
        shell: pwsh
        run: |
          $tag = if ("${{ github.event.inputs.tag }}") { "${{ github.event.inputs.tag }}" } else { "${{ github.ref_name }}" }
          $version = $tag.TrimStart("v")
          New-Item -ItemType Directory -Force dist/windows/app | Out-Null
          Copy-Item target/release/agentkey.exe dist/windows/app/agentkey.exe
          Copy-Item target/release/agentkey-manager.exe dist/windows/app/agentkey-manager.exe
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" "/DVERSION=$version" scripts/installer/windows/AgentKey.nsi
      - name: Upload Windows asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release upload "$TAG" dist/windows/AgentKey-*-windows-x64-setup.exe --clobber

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
          - runner: macos-14
            target: aarch64-apple-darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/agentkey-manager/package-lock.json
      - name: Build frontend
        working-directory: apps/agentkey-manager
        run: npm ci && npm run vite:build
      - name: Build binaries
        run: cargo build --release --target ${{ matrix.target }} -p agentkey-launcher -p agentkey-manager
      - name: Package DMG
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          BINARY_DIR="target/${{ matrix.target }}/release" scripts/installer/macos/package-dmg.sh "$VERSION" "${{ matrix.arch }}"
      - name: Upload macOS asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release upload "$TAG" dist/macos/AgentKey-*-macos-${{ matrix.arch }}.dmg --clobber

  latest-json:
    runs-on: ubuntu-latest
    needs:
      - windows
      - macos
    steps:
      - name: Upload latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/$TAG"
          cat > latest.json <<EOF
          {
            "version": "$TAG",
            "url": "$RELEASE_URL",
            "body": "AgentKey $VERSION",
            "assets": [
              {
                "name": "AgentKey-$VERSION-windows-x64-setup.exe",
                "url": "https://github.com/${{ github.repository }}/releases/download/$TAG/AgentKey-$VERSION-windows-x64-setup.exe"
              },
              {
                "name": "AgentKey-$VERSION-macos-x64.dmg",
                "url": "https://github.com/${{ github.repository }}/releases/download/$TAG/AgentKey-$VERSION-macos-x64.dmg"
              },
              {
                "name": "AgentKey-$VERSION-macos-arm64.dmg",
                "url": "https://github.com/${{ github.repository }}/releases/download/$TAG/AgentKey-$VERSION-macos-arm64.dmg"
              }
            ]
          }
          EOF
          gh release upload "$TAG" latest.json --clobber
